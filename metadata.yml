Identifier: eos8bpb
Slug: ecoli-permeation-efflux
Status: In progress
Title: MechGate E. coli Permeation
Description: 'Scores a molecule against five Escherichia coli barriers with separate
  models: OmpF porin permeation, multi-porin permeation, lipid-route permeation, efflux
  susceptibility and whole-cell activity (MIC of 8 ug/mL or lower), built from 3D
  conformer and charge descriptors at pH 7.4. Each score comes with its percentile
  against 73, 154 CO-ADD compounds, and no total score is formed. Evaluated retrospectively
  on marketed drugs only; results depend on the SMILES string written.'
